name: EDR1 expanded-gate harness

on:
  push:
    branches:
      - research/capacity-aware-edr1
    paths:
      - ".github/workflows/edr1-expanded-gate.yml"
      - "final_rdhei_protocol_gate_20261022/**"
      - "tests/test_edr1_expanded_gate.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harness-and-protocol-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test and protocol dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile EDR1 scripts
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/run_gate.py \
            final_rdhei_protocol_gate_20261022/protocol.py \
            final_rdhei_protocol_gate_20261022/wire.py \
            final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py

      - name: Test dataset discovery and capacity ledger
        run: python -m pytest -q tests/test_edr1_expanded_gate.py

      - name: Create a deterministic grayscale smoke fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          import numpy as np
          from PIL import Image
          root = Path("/tmp/edr1-smoke-input")
          root.mkdir(parents=True, exist_ok=True)
          Image.fromarray(np.full((128, 128), 128, dtype=np.uint8), mode="L").save(root / "constant128_smoke.png")
          PY

      - name: Execute the real EDR1 protocol on the smoke fixture
        run: |
          python final_rdhei_protocol_gate_20261022/run_gate.py \
            --data-dir /tmp/edr1-smoke-input \
            --allow-missing-baseline \
            --output-dir /tmp/edr1-expanded-smoke-output

      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edr1-expanded-gate-smoke-evidence
          path: /tmp/edr1-expanded-smoke-output/
          if-no-files-found: warn
          retention-days: 14
