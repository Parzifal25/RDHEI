name: RDHEI Final Evaluation

on:
  push:
    paths:
      - "final_rdhei_protocol_gate_20261022/**"
      - "self_contained_rdhei_feasibility_20261022/**"
      - "models/**"
      - "tests/rdhei_integrity_regression.py"
      - ".github/workflows/rdhei-final-evaluation.yml"
  workflow_dispatch:

jobs:
  integrity-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install protocol and model dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow pycryptodome scipy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run authenticated protocol tamper tests
        run: python tests/rdhei_integrity_regression.py

  scalability-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        size: [512, 1024, 2048]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pillow psutil pycryptodome scipy
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Verify checkpoint
        run: test -f models/v4_patch3.pth
      - name: Run benchmark
        run: |
          python final_rdhei_protocol_gate_20261022/run_edr2_e2e_benchmark.py --output-dir "results/ci_scalability_${{ matrix.size }}" --size ${{ matrix.size }} --warmups 1 --repeats 5
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: scalability-${{ matrix.size }}
          path: results/ci_scalability_${{ matrix.size }}/
