name: RGB post-run reporting fix checks

on:
  push:
    branches:
      - fix/rgb-post-run-reporting
    paths:
      - ".github/workflows/rgb-reporting-fix-check.yml"
      - "final_rdhei_protocol_gate_20261022/run_rgb_gate.py"
      - "final_rdhei_protocol_gate_20261022/analyze_rgb_evidence.py"
      - "tests/test_edr2_rgb_dataset.py"

permissions:
  contents: read

jobs:
  rgb-reporting-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out reporting-fix branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reporting and regression dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome pytest pandas matplotlib tabulate
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile reporting and RGB runner modules
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/run_rgb_gate.py \
            final_rdhei_protocol_gate_20261022/analyze_rgb_evidence.py

      - name: Run RGB and grayscale regression suite
        run: |
          python -m pytest -q \
            tests/test_edr2_publication_hardening.py \
            tests/test_edr2_receiver_only.py \
            tests/test_edr2_rgb.py \
            tests/test_edr2_rgb_dataset.py
