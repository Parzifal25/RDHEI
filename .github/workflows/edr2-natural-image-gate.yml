name: EDR2 natural-image gate

on:
  push:
    branches:
      - research/capacity-aware-edr1
    paths:
      - ".github/workflows/edr2-natural-image-gate.yml"
      - "final_rdhei_protocol_gate_20261022/**"
      - "tests/test_edr2_receiver_only.py"
  workflow_dispatch:
    inputs:
      run_full_corpus:
        description: "Run the complete EDR2 evaluation using the six original grayscale baselines and native USC-SIPI grayscale images."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compile-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test and protocol dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile EDR2 scripts
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/run_gate.py \
            final_rdhei_protocol_gate_20261022/protocol.py \
            final_rdhei_protocol_gate_20261022/wire.py \
            final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py \
            src/train.py

      - name: Test receiver input contract, key separation, corpus discovery and capacity ledger
        run: python -m pytest -q tests/test_edr2_receiver_only.py

  full-natural-image-corpus:
    if: ${{ inputs.run_full_corpus == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out research branch and original baselines
        uses: actions/checkout@v4

      - name: Verify the six exact original baseline inputs
        run: |
          set -euo pipefail
          for name in Airplane Baboon Goldhill Jetplane Lena Peppers; do
            test -s "data/kodak_gray/${name}.png" || {
              echo "Missing exact original baseline: data/kodak_gray/${name}.png"
              exit 1
            }
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install EDR2 runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile EDR2 scripts
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/run_gate.py \
            final_rdhei_protocol_gate_20261022/protocol.py \
            final_rdhei_protocol_gate_20261022/wire.py \
            final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py

      - name: Prepare official native grayscale corpus inside data/kodak_gray
        run: |
          python final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py \
            --output-dir data/kodak_gray \
            --archive-dir /tmp/usc_sipi_archives

      - name: Run complete EDR2 capacity and exact-recovery evaluation
        run: |
          python final_rdhei_protocol_gate_20261022/run_gate.py \
            --data-dir data/kodak_gray \
            --output-dir /tmp/edr2-full-natural-corpus-evidence

      - name: Upload full natural-image EDR2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edr2-full-natural-corpus-evidence
          path: /tmp/edr2-full-natural-corpus-evidence/
          if-no-files-found: warn
          retention-days: 30
