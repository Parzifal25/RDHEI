name: EDR2 natural-image gate

on:
  push:
    branches:
      - research/capacity-aware-edr1
      - research/edr2-publication-hardening
    paths:
      - ".github/workflows/edr2-natural-image-gate.yml"
      - "final_rdhei_protocol_gate_20261022/**"
      - "tests/test_mapping.py"
      - "tests/test_edr2_receiver_only.py"
      - "tests/test_edr2_publication_hardening.py"
      - "tests/test_usc_sipi_curation.py"
      - "src/cnn_model.py"
      - "src/rdhei_core.py"
  workflow_dispatch:
    inputs:
      run_full_corpus:
        description: "Download, curate, and run the full supported USC-SIPI grayscale evaluation corpus."
        required: true
        type: boolean
        default: false
      run_fixed_phase_ablation:
        description: "Also run matched fixed-phase 0-3 exact-recovery ablations."
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  compile-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test and protocol dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome pytest pandas matplotlib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile EDR2 and USC-SIPI preparation scripts
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/run_gate.py \
            final_rdhei_protocol_gate_20261022/predictor.py \
            final_rdhei_protocol_gate_20261022/protocol.py \
            final_rdhei_protocol_gate_20261022/wire.py \
            final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py \
            final_rdhei_protocol_gate_20261022/curate_usc_sipi_allowlist.py \
            final_rdhei_protocol_gate_20261022/prepare_edr2_visual_samples.py \
            final_rdhei_protocol_gate_20261022/build_edr2_visual_gallery.py \
            final_rdhei_protocol_gate_20261022/analyze_edr2_evidence.py \
            src/train.py

      - name: Test mapping, receiver contract, EDR2 protocol and corpus curation
        run: |
          python -m pytest -q \
            tests/test_mapping.py \
            tests/test_edr2_receiver_only.py \
            tests/test_edr2_publication_hardening.py \
            tests/test_usc_sipi_curation.py \
            tests/test_edr2_analysis.py

  full-natural-image-corpus:
    if: ${{ inputs.run_full_corpus == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install EDR2 runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome pandas matplotlib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile EDR2 and corpus preparation scripts
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/run_gate.py \
            final_rdhei_protocol_gate_20261022/protocol.py \
            final_rdhei_protocol_gate_20261022/wire.py \
            final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py \
            final_rdhei_protocol_gate_20261022/curate_usc_sipi_allowlist.py \
            final_rdhei_protocol_gate_20261022/prepare_edr2_visual_samples.py \
            final_rdhei_protocol_gate_20261022/build_edr2_visual_gallery.py \
            final_rdhei_protocol_gate_20261022/analyze_edr2_evidence.py

      - name: Download and inventory official USC-SIPI native grayscale TIFFs
        run: |
          python final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py \
            --output-dir data/usc_sipi_gray \
            --archive-dir data/usc_sipi_archives

      - name: Build hash-pinned, catalogue-reviewed USC-SIPI allowlist
        run: |
          python final_rdhei_protocol_gate_20261022/curate_usc_sipi_allowlist.py \
            --manifest data/usc_sipi_gray/dataset_manifest.json \
            --output data/usc_sipi_gray/natural_image_allowlist.json

      - name: Run complete EDR2 natural-image capacity and exact-recovery evaluation
        run: |
          set -euo pipefail
          BASELINE_READY=1
          for image_name in Airplane Baboon Goldhill Jetplane Lena Peppers; do
            if [ ! -s "data/kodak_gray/$image_name.png" ]; then
              BASELINE_READY=0
              break
            fi
          done
          if [ "$BASELINE_READY" -eq 1 ]; then
            python final_rdhei_protocol_gate_20261022/run_gate.py \
              --data-dir data/kodak_gray \
              --data-dir data/usc_sipi_gray \
              --output-dir /tmp/edr2-full-natural-corpus-evidence
          else
            python final_rdhei_protocol_gate_20261022/run_gate.py \
              --data-dir data/usc_sipi_gray \
              --allow-missing-baseline \
              --output-dir /tmp/edr2-full-natural-corpus-evidence
          fi

      - name: Run matched fixed-phase ablations (phases 0-3)
        if: ${{ inputs.run_fixed_phase_ablation == true }}
        run: |
          set -euo pipefail
          for phase in 0 1 2 3; do
            echo "Running fixed EDR2 lattice phase $phase"
            python final_rdhei_protocol_gate_20261022/run_gate.py \
              --data-dir data/usc_sipi_gray \
              --allow-missing-baseline \
              --fixed-phase "$phase" \
              --output-dir "/tmp/edr2-fixed-phase-$phase"
          done

      - name: Analyze fixed phases and correlation-clustered capacity
        if: ${{ inputs.run_fixed_phase_ablation == true }}
        run: |
          python final_rdhei_protocol_gate_20261022/analyze_edr2_evidence.py \
            --adaptive-dir /tmp/edr2-full-natural-corpus-evidence \
            --fixed-phase-root /tmp \
            --output-dir /tmp/edr2-publication-analysis

      - name: Prepare one representative sample per USC-SIPI stratum
        run: |
          python final_rdhei_protocol_gate_20261022/prepare_edr2_visual_samples.py \
            --source-dir data/usc_sipi_gray \
            --evidence-dir /tmp/edr2-full-natural-corpus-evidence \
            --output-dir data/usc_sipi_visual_samples

      - name: Run representative image round trips with image artifacts retained
        run: |
          python final_rdhei_protocol_gate_20261022/run_gate.py \
            --data-dir data/usc_sipi_visual_samples \
            --allow-missing-baseline \
            --keep-artifacts \
            --output-dir /tmp/edr2-visual-sample-evidence

      - name: Build original-reserved-encrypted-recovered image gallery
        run: |
          python final_rdhei_protocol_gate_20261022/build_edr2_visual_gallery.py \
            --sample-dir data/usc_sipi_visual_samples \
            --evidence-dir /tmp/edr2-visual-sample-evidence \
            --output-dir /tmp/edr2-visual-gallery

      - name: Package hash-pinned USC-SIPI native grayscale source images
        run: |
          tar -czf /tmp/usc-sipi-native-grayscale-source.tar.gz -C data/usc_sipi_gray .

      - name: Upload full natural-image EDR2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edr2-full-natural-corpus-evidence
          path: /tmp/edr2-full-natural-corpus-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload paper-facing phase and correlation analysis
        if: always() && inputs.run_fixed_phase_ablation == true
        uses: actions/upload-artifact@v4
        with:
          name: edr2-publication-analysis
          path: /tmp/edr2-publication-analysis/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload fixed-phase ablation evidence
        if: always() && inputs.run_fixed_phase_ablation == true
        uses: actions/upload-artifact@v4
        with:
          name: edr2-fixed-phase-ablation-evidence
          path: |
            /tmp/edr2-fixed-phase-0/
            /tmp/edr2-fixed-phase-1/
            /tmp/edr2-fixed-phase-2/
            /tmp/edr2-fixed-phase-3/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload representative image gallery and panels
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edr2-representative-image-gallery
          path: |
            /tmp/edr2-visual-sample-evidence/
            /tmp/edr2-visual-gallery/
            data/usc_sipi_visual_samples/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload USC-SIPI source TIFF corpus and curation manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: usc-sipi-source-images-and-manifests
          path: |
            /tmp/usc-sipi-native-grayscale-source.tar.gz
            data/usc_sipi_gray/dataset_manifest.json
            data/usc_sipi_gray/natural_image_allowlist.json
          if-no-files-found: warn
          retention-days: 30
