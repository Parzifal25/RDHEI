name: EDR2 natural-image gate

on:
  push:
    branches:
      - research/capacity-aware-edr1
      - research/edr2-publication-hardening
    paths:
      - ".github/workflows/edr2-natural-image-gate.yml"
      - "final_rdhei_protocol_gate_20261022/**"
      - "tests/test_mapping.py"
      - "tests/test_edr2_receiver_only.py"
      - "tests/test_edr2_publication_hardening.py"
      - "src/cnn_model.py"
      - "src/rdhei_core.py"
  workflow_dispatch:
    inputs:
      run_full_corpus:
        description: "Run the complete EDR2 evaluation using the six original grayscale baselines and native USC-SIPI grayscale images."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  compile-and-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test and protocol dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile EDR2 scripts
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/run_gate.py \
            final_rdhei_protocol_gate_20261022/predictor.py \
            final_rdhei_protocol_gate_20261022/protocol.py \
            final_rdhei_protocol_gate_20261022/wire.py \
            final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py \
            src/train.py

      - name: Test mapping, receiver contract, EDR2 protocol and natural-corpus guards
        run: |
          python -m pytest -q \
            tests/test_mapping.py \
            tests/test_edr2_receiver_only.py \
            tests/test_edr2_publication_hardening.py

  full-natural-image-corpus:
    if: ${{ inputs.run_full_corpus == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out research branch and original baselines
        uses: actions/checkout@v4

      - name: Verify the six exact original baseline inputs
        run: |
          set -euo pipefail
          for name in Airplane Baboon Goldhill Jetplane Lena Peppers; do
            test -s "data/kodak_gray/${name}.png" || {
              echo "Missing exact original baseline: data/kodak_gray/${name}.png"
              exit 1
            }
          done

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install EDR2 runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile EDR2 scripts
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/run_gate.py \
            final_rdhei_protocol_gate_20261022/protocol.py \
            final_rdhei_protocol_gate_20261022/wire.py \
            final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py

      - name: Require curator-reviewed allowlist for expanded USC-SIPI data
        run: |
          if [ -d data/usc_sipi_gray ] && find data/usc_sipi_gray -type f -name '*.tiff' -print -quit | grep -q .; then
            test -s data/usc_sipi_gray/natural_image_allowlist.json || {
              echo "USC-SIPI inventory is present but no manually reviewed natural_image_allowlist.json was committed."
              echo "Prepare and curate the archive locally, then commit the exact allowlist before running the expanded corpus gate."
              exit 1
            }
          fi

      - name: Run complete EDR2 natural-image capacity and exact-recovery evaluation
        run: |
          set -euo pipefail
          extra_data_args=()
          if [ -d data/usc_sipi_gray ] && find data/usc_sipi_gray -type f \\
            \\( -iname '*.png' -o -iname '*.pgm' -o -iname '*.bmp' -o -iname '*.tif' -o -iname '*.tiff' \\) \\
            -print -quit | grep -q .; then
            extra_data_args+=(--data-dir data/usc_sipi_gray)
          fi
          python final_rdhei_protocol_gate_20261022/run_gate.py \\
            --data-dir data/kodak_gray \\
            "${extra_data_args[@]}" \\
            --output-dir /tmp/edr2-full-natural-corpus-evidence

      - name: Upload full natural-image EDR2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edr2-full-natural-corpus-evidence
          path: /tmp/edr2-full-natural-corpus-evidence/
          if-no-files-found: warn
          retention-days: 30
