name: EDR2 RGB extension gate
# Launch corrected CPU, v3 geometry, and authenticated RGB parser fuzz gates.

on:
  push:
    branches:
      - research/edr2-rgb-extension
      - research/edr2-runtime-optimization
    paths:
      - ".github/workflows/edr2-rgb-extension.yml"
      - "final_rdhei_protocol_gate_20261022/rgb_*.py"
      - "final_rdhei_protocol_gate_20261022/prepare_usc_sipi_rgb.py"
      - "final_rdhei_protocol_gate_20261022/run_rgb_gate.py"
      - "final_rdhei_protocol_gate_20261022/run_gray_comparative_gate.py"
      - "final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py"
      - "final_rdhei_protocol_gate_20261022/curate_usc_sipi_allowlist.py"
      - "src/baselines.py"
      - "models/v1_full.pth"
      - "models/v2_no_residual.pth"
      - "models/v3_no_weighted_loss.pth"
      - "models/v5_patch7.pth"
      - "final_rdhei_protocol_gate_20261022/analyze_rgb_evidence.py"
      - "final_rdhei_protocol_gate_20261022/rgb_receiver_cli.py"
      - "final_rdhei_protocol_gate_20261022/run_complexity_benchmark.py"
      - "final_rdhei_protocol_gate_20261022/benchmark_predictor_optimization.py"
      - "final_rdhei_protocol_gate_20261022/run_v3_safe_lattice_experiment.py"
      - "final_rdhei_protocol_gate_20261022/run_edr2_native_e2e_benchmark.py"
      - "final_rdhei_protocol_gate_20261022/predictor.py"
      - "final_rdhei_protocol_gate_20261022/wire.py"
      - "tests/test_edr2_rgb.py"
      - "tests/test_edr2_rgb_dataset.py"
      - "tests/test_edr2_adversarial_packets.py"
      - "tests/fuzz_edr2_parser.py"
      - "tests/fuzz_edr2_rgb_parser.py"
      - "src/cnn_model.py"
      - "models/v4_patch3.pth"
  workflow_dispatch:
    inputs:
      run_rgb_smoke_tests:
        description: "Run RGB protocol round-trip tests."
        required: true
        type: boolean
        default: true
      run_rgb_full_corpus:
        description: "Download and evaluate the official USC-SIPI native RGB subset."
        required: true
        type: boolean
        default: false
      run_grayscale_comparison:
        description: "Download and run the full-corpus grayscale predictor/CNN-ablation/histogram-shifting end-to-end comparison."
        required: true
        type: boolean
        default: false
      run_complexity_benchmark:
        description: "Run the standalone reproducible CNN complexity, memory and runtime benchmark."
        required: true
        type: boolean
        default: false
      run_e2e_benchmark:
        description: "Run the complete active EDR2 pipeline timing and RSS benchmark."
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  rgb-protocol-tests:
    if: ${{ inputs.run_rgb_smoke_tests == true || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out RGB extension branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install RGB protocol dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome pytest pandas matplotlib
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile grayscale and RGB protocol modules
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/predictor.py \
            final_rdhei_protocol_gate_20261022/wire.py \
            final_rdhei_protocol_gate_20261022/rgb_wire.py \
            final_rdhei_protocol_gate_20261022/rgb_protocol.py \
            final_rdhei_protocol_gate_20261022/run_rgb_gate.py \
            final_rdhei_protocol_gate_20261022/prepare_usc_sipi_rgb.py \
            final_rdhei_protocol_gate_20261022/analyze_rgb_evidence.py \
            final_rdhei_protocol_gate_20261022/run_gray_comparative_gate.py

      - name: Run grayscale regression and RGB exact-recovery tests
        run: |
          python -m pytest -q \
            tests/test_edr2_publication_hardening.py \
            tests/test_edr2_receiver_only.py \
            tests/test_edr2_rgb.py \
            tests/test_edr2_rgb_dataset.py \
            tests/test_edr2_adversarial_packets.py



  grayscale-comparative-evaluation:
    # A one-time explicit commit marker launches this requested full-corpus job;
    # later pushes do not repeat it. Manual dispatch is also supported.
    if: ${{ inputs.run_grayscale_comparison == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-grayscale-e2e]')) }}
    needs: rgb-protocol-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install grayscale comparison dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome pandas matplotlib tabulate psutil
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile comparative runner and existing EDR2 modules
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/run_gray_comparative_gate.py \
            final_rdhei_protocol_gate_20261022/run_gate.py \
            final_rdhei_protocol_gate_20261022/predictor.py \
            final_rdhei_protocol_gate_20261022/protocol.py \
            final_rdhei_protocol_gate_20261022/wire.py \
            final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py \
            final_rdhei_protocol_gate_20261022/curate_usc_sipi_allowlist.py

      - name: Run predictor, all CNN-ablation and histogram-shifting exact-recovery self-tests
        run: |
          python final_rdhei_protocol_gate_20261022/run_gray_comparative_gate.py \
            --self-test --data-dir . --output-dir /tmp/grayscale-self-test-placeholder

      - name: Download and inventory official native USC-SIPI grayscale TIFFs
        run: |
          python final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py \
            --output-dir /tmp/usc-sipi-grayscale \
            --archive-dir /tmp/usc-sipi-archives

      - name: Build reviewed and hash-pinned USC-SIPI allowlist
        run: |
          python final_rdhei_protocol_gate_20261022/curate_usc_sipi_allowlist.py \
            --manifest /tmp/usc-sipi-grayscale/dataset_manifest.json \
            --output /tmp/usc-sipi-grayscale/natural_image_allowlist.json

      - name: Run proposed CNN native EDR2 step-2 full-corpus exact recovery
        run: |
          python final_rdhei_protocol_gate_20261022/run_gate.py \
            --data-dir /tmp/usc-sipi-grayscale \
            --allow-missing-baseline \
            --threads 4 \
            --output-dir /tmp/proposed-cnn-native-edr2-e2e

      - name: Run 243-image matched predictor and histogram-shifting E2E comparison
        run: |
          python final_rdhei_protocol_gate_20261022/run_gray_comparative_gate.py \
            --data-dir /tmp/usc-sipi-grayscale \
            --expected-images 243 \
            --threads 4 \
            --output-dir /tmp/grayscale-e2e-comparison

      - name: Upload per-image evidence, exact-recovery records and comparative report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grayscale-full-corpus-e2e-comparison
          path: |
            /tmp/grayscale-e2e-comparison/
            /tmp/proposed-cnn-native-edr2-e2e/
            /tmp/usc-sipi-grayscale/dataset_manifest.json
            /tmp/usc-sipi-grayscale/natural_image_allowlist.json
          if-no-files-found: warn
          retention-days: 30

  complexity-benchmark:
    # Standalone rerun keeps the compute-cost audit independent of the long RGB corpus job.
    if: ${{ inputs.run_complexity_benchmark == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-complexity-only]')) }}
    needs: rgb-protocol-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out complexity benchmark revision
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install reproducible complexity dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome pandas matplotlib psutil
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile frozen predictor and complexity tools
        run: |
          python -m py_compile \
            src/baselines.py \
            src/cnn_model.py \
            src/predictor.py \
            final_rdhei_protocol_gate_20261022/wire.py \
            final_rdhei_protocol_gate_20261022/run_complexity_benchmark.py

      - name: Run reproducible frozen-CNN complexity, runtime and memory benchmark
        run: |
          python final_rdhei_protocol_gate_20261022/run_complexity_benchmark.py \
            --output-dir /tmp/rdhei-complexity-benchmark

      - name: Sweep exact-equivalence CPU patch extraction and inference settings
        run: |
          python final_rdhei_protocol_gate_20261022/benchmark_predictor_optimization.py \
            --output-dir /tmp/rdhei-predictor-optimization

      - name: Upload standalone reproducible complexity benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdhei-reproducible-complexity-benchmark-corrected
          path: |
            /tmp/rdhei-complexity-benchmark/
            /tmp/rdhei-predictor-optimization/
          if-no-files-found: warn
          retention-days: 30

  v3-safe-lattice-experiment:
    # Compare the strongest matched-MAE CNN checkpoint under a geometry safe for its 5x5 receptive field.
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[run-v3-lattice]') }}
    needs: rgb-protocol-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out v3 experiment branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install v3 native experiment dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome pandas psutil
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile experimental v3 harness and protocol
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/run_v3_safe_lattice_experiment.py \
            final_rdhei_protocol_gate_20261022/predictor.py \
            final_rdhei_protocol_gate_20261022/protocol.py \
            final_rdhei_protocol_gate_20261022/wire.py

      - name: Download and inventory native USC-SIPI grayscale TIFFs
        run: |
          python final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py \
            --output-dir /tmp/usc-sipi-grayscale-v3 \
            --archive-dir /tmp/usc-sipi-grayscale-v3-archives

      - name: Build hash-pinned native grayscale allowlist
        run: |
          python final_rdhei_protocol_gate_20261022/curate_usc_sipi_allowlist.py \
            --manifest /tmp/usc-sipi-grayscale-v3/dataset_manifest.json \
            --output /tmp/usc-sipi-grayscale-v3/natural_image_allowlist.json

      - name: Run v3 step-3 nine-phase system experiment on all 243 native images
        run: |
          python final_rdhei_protocol_gate_20261022/run_v3_safe_lattice_experiment.py \
            --data-dir /tmp/usc-sipi-grayscale-v3 \
            --expected-images 243 --threads 4 \
            --output-dir /tmp/rdhei-v3-step3-nine-phase

      - name: Upload v3 whole-system capacity, invariance and exact-recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdhei-v3-step3-nine-phase-native-experiment
          path: /tmp/rdhei-v3-step3-nine-phase/
          if-no-files-found: warn
          retention-days: 90

  rgb-full-corpus:
    # Final all-positive-blend independent receiver sweep and reproducible complexity benchmark.
    if: ${{ inputs.run_rgb_full_corpus == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-rgb-full]')) }}
    needs: rgb-protocol-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out RGB extension branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install RGB benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome pandas matplotlib tabulate psutil
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile RGB dataset and evaluation tools
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/rgb_wire.py \
            final_rdhei_protocol_gate_20261022/rgb_protocol.py \
            final_rdhei_protocol_gate_20261022/prepare_usc_sipi_rgb.py \
            final_rdhei_protocol_gate_20261022/run_rgb_gate.py \
            final_rdhei_protocol_gate_20261022/analyze_rgb_evidence.py \
            final_rdhei_protocol_gate_20261022/rgb_receiver_cli.py \
            final_rdhei_protocol_gate_20261022/run_complexity_benchmark.py

      - name: Download and verify official USC-SIPI RGB TIFFs
        run: |
          python final_rdhei_protocol_gate_20261022/prepare_usc_sipi_rgb.py \
            --output-dir /tmp/usc-sipi-native-rgb

      - name: Run CC-EDR2-RGB full native-colour corpus evaluation
        run: |
          python final_rdhei_protocol_gate_20261022/run_rgb_gate.py \
            --data-dir /tmp/usc-sipi-native-rgb \
            --output-dir /tmp/cc-edr2-rgb-evidence
          cp /tmp/usc-sipi-native-rgb/rgb_source_manifest.json \
            /tmp/cc-edr2-rgb-evidence/

      - name: Analyze RGB blend and phase evidence
        run: |
          python final_rdhei_protocol_gate_20261022/analyze_rgb_evidence.py \
            --evidence-dir /tmp/cc-edr2-rgb-evidence \
            --output-dir /tmp/cc-edr2-rgb-paper-analysis

      - name: Run reproducible frozen-CNN complexity, runtime and memory benchmark
        run: |
          python final_rdhei_protocol_gate_20261022/run_complexity_benchmark.py \
            --output-dir /tmp/rdhei-complexity-benchmark

      - name: Upload CC-EDR2-RGB raw evidence tables and manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc-edr2-rgb-full-corpus-evidence
          path: /tmp/cc-edr2-rgb-evidence/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload reproducible complexity benchmark report, measurements and figures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdhei-reproducible-complexity-benchmark
          path: /tmp/rdhei-complexity-benchmark/
          if-no-files-found: warn
          retention-days: 30

      - name: Upload CC-EDR2-RGB paper tables and charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc-edr2-rgb-paper-analysis
          path: /tmp/cc-edr2-rgb-paper-analysis/
          if-no-files-found: warn
          retention-days: 30

  e2e-runtime-memory-benchmark:
    if: ${{ inputs.run_e2e_benchmark == true || (github.event_name == 'push' && contains(github.event.head_commit.message, '[run-e2e-only]')) }}
    needs: rgb-protocol-tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out EDR2 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install active EDR2 benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome psutil
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile active EDR2 benchmark
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/run_edr2_native_e2e_benchmark.py \
            final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py \
            final_rdhei_protocol_gate_20261022/protocol.py \
            final_rdhei_protocol_gate_20261022/wire.py

      - name: Download native USC-SIPI grayscale image for end-to-end timing
        run: |
          python final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py \
            --output-dir /tmp/usc-sipi-gray-e2e \
            --archive-dir /tmp/usc-sipi-gray-e2e-archives

      - name: Run full active EDR2 pipeline runtime and memory benchmark on a native image
        run: |
          python final_rdhei_protocol_gate_20261022/run_edr2_native_e2e_benchmark.py \
            --output-dir /tmp/rdhei-e2e-runtime-memory \
            --image-path /tmp/usc-sipi-gray-e2e/misc/5.2.08.tiff \
            --repeats 10 --warmups 2 --size 512

      - name: Upload end-to-end runtime and memory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdhei-active-e2e-runtime-memory-benchmark
          path: /tmp/rdhei-e2e-runtime-memory/
          if-no-files-found: warn
          retention-days: 30

  authenticated-parser-fuzz:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[run-parser-fuzz]') }}
    needs: rgb-protocol-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out EDR2 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install parser fuzz dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome atheris
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile parser and fuzz target
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/protocol.py \
            final_rdhei_protocol_gate_20261022/wire.py \
            tests/fuzz_edr2_parser.py

      - name: Build authenticated parser seed corpus
        run: |
          python tests/fuzz_edr2_parser.py --write-seed-dir /tmp/edr2-fuzz-corpus
          ls -lh /tmp/edr2-fuzz-corpus

      - name: Run 20,000 coverage-guided parser fuzz inputs
        run: |
          python tests/fuzz_edr2_parser.py \
            -max_len=4096 -runs=20000 \
            /tmp/edr2-fuzz-corpus
        env:
          ATHERIS_FUZZER_DEBUG: "1"

      - name: Upload fuzz corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdhei-edr2-parser-fuzz-corpus-and-findings
          path: |
            /tmp/edr2-fuzz-corpus/
            /tmp/edr2-fuzz-crash-*
          if-no-files-found: warn
          retention-days: 90

  authenticated-rgb-parser-fuzz:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[run-rgb-fuzz]') }}
    needs: rgb-protocol-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out RGB parser fuzz branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install RGB parser fuzz dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome atheris
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile RGB packet parser and fuzz target
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/rgb_wire.py \
            final_rdhei_protocol_gate_20261022/rgb_protocol.py \
            tests/fuzz_edr2_rgb_parser.py

      - name: Build RGB parser fuzz seed corpus
        run: |
          mkdir -p /tmp/edr2-rgb-fuzz-corpus
          printf '\\x00' > /tmp/edr2-rgb-fuzz-corpus/seed

      - name: Run 20,000 authenticated RGB parser fuzz inputs
        run: |
          python tests/fuzz_edr2_rgb_parser.py \
            -max_len=4096 -runs=20000 \
            /tmp/edr2-rgb-fuzz-corpus
        env:
          ATHERIS_FUZZER_DEBUG: "1"

      - name: Upload RGB fuzz corpus and crash artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rdhei-edr2-rgb-parser-fuzz-corpus-and-findings
          path: |
            /tmp/edr2-rgb-fuzz-corpus/
            /tmp/edr2-rgb-fuzz-crash-*
          if-no-files-found: warn
          retention-days: 90

  native-grayscale-final-audit:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[run-final-gray]') }}
    needs: rgb-protocol-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out EDR2 branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install native grayscale evaluation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow pycryptodome pandas psutil
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Compile active grayscale protocol and corpus tools
        run: |
          python -m py_compile \
            final_rdhei_protocol_gate_20261022/protocol.py \
            final_rdhei_protocol_gate_20261022/wire.py \
            final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py \
            final_rdhei_protocol_gate_20261022/curate_usc_sipi_allowlist.py \
            final_rdhei_protocol_gate_20261022/run_gate.py

      - name: Download and inventory official USC-SIPI native grayscale TIFFs
        run: |
          python final_rdhei_protocol_gate_20261022/prepare_usc_sipi_gray.py \
            --output-dir /tmp/usc-sipi-gray-final \
            --archive-dir /tmp/usc-sipi-gray-archives

      - name: Build current hash-pinned catalogue-reviewed allowlist
        run: |
          python final_rdhei_protocol_gate_20261022/curate_usc_sipi_allowlist.py \
            --manifest /tmp/usc-sipi-gray-final/dataset_manifest.json \
            --output /tmp/usc-sipi-gray-final/natural_image_allowlist.json

      - name: Run complete native grayscale EDR2 four-phase corpus gate
        run: |
          python final_rdhei_protocol_gate_20261022/run_gate.py \
            --data-dir /tmp/usc-sipi-gray-final \
            --output-dir /tmp/edr2-native-gray-final-evidence \
            --allow-missing-baseline \
            --seed 20261116

      - name: Copy current source and curation manifests into evidence bundle
        if: always()
        run: |
          mkdir -p /tmp/edr2-native-gray-final-evidence/manifests
          cp /tmp/usc-sipi-gray-final/dataset_manifest.json /tmp/edr2-native-gray-final-evidence/manifests/ || true
          cp /tmp/usc-sipi-gray-final/natural_image_allowlist.json /tmp/edr2-native-gray-final-evidence/manifests/ || true
          cp /tmp/usc-sipi-gray-archives/*.tar.gz /tmp/edr2-native-gray-final-evidence/manifests/ 2>/dev/null || true

      - name: Upload final native grayscale raw evidence and dataset provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edr2-native-grayscale-final-harmonized-evidence
          path: /tmp/edr2-native-gray-final-evidence/
          if-no-files-found: warn
          retention-days: 90
