end" class="label">CALIC</text><rect x="300" y="231" width="1.2440571428571428" height="27" rx="4" fill="#78A6C9"/><text x="310.2440571428571" y="249" class="value">7.257 ms</text><text x="282" y="297" text-anchor="end" class="label">CNN v4 3×3</text><rect x="300" y="279" width="121.45354285714286" height="27" rx="4" fill="#C66B57"/><text x="430.45354285714285" y="297" class="value">708.479 ms</text><text x="282" y="345" text-anchor="end" class="label">CNN v1 5×5</text><rect x="300" y="327" width="244.65394285714282" height="27" rx="4" fill="#D48B4C"/><text x="553.6539428571429" y="345" class="value">1,427.148 ms</text><text x="282" y="393" text-anchor="end" class="label">CNN v2 5×5</text><rect x="300" y="375" width="218.67154285714287" height="27" rx="4" fill="#C66B57"/><text x="527.6715428571429" y="393" class="value">1,275.584 ms</text><text x="282" y="441" text-anchor="end" class="label">CNN v3 5×5</text><rect x="300" y="423" width="246.47931428571428" height="27" rx="4" fill="#78956E"/><text x="555.4793142857143" y="441" class="value">1,437.796 ms</text><text x="282" y="489" text-anchor="end" class="label">CNN v5 7×7</text><rect x="300" y="471" width="521.3376000000001" height="27" rx="4" fill="#8E7BAA"/><text x="830.3376000000001" y="489" class="value">3,041.136 ms</text><text x="600" y="560" text-anchor="middle" class="axis">Mean full-map prediction time (milliseconds)</text><text x="48" y="575" class="note">Predictor-only timing excludes embedding, encryption, extraction and recovery.</text></svg>