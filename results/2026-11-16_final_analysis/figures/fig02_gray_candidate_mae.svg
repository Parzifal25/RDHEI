<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610"><title>Matched grayscale prediction error</title><desc>Mean candidate MAE across 243 images; lower is better</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202a35}.title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#566270}.axis{font-size:12px;fill:#596574}.label{font-size:14px}.value{font-size:13px;font-weight:700}.note{font-size:12px;fill:#5b6571}.grid{stroke:#e3e8ee;stroke-width:1}</style><rect width="1000" height="610" fill="#fff"/><text x="48" y="48" class="title">Matched grayscale prediction error</text><text x="48" y="76" class="subtitle">Mean candidate MAE across 243 images; lower is better</text><line x1="300" y1="112" x2="300" y2="504" class="grid"/><text x="300" y="532" text-anchor="middle" class="axis">0</text><line x1="420" y1="112" x2="420" y2="504" class="grid"/><text x="420" y="532" text-anchor="middle" class="axis">2</text><line x1="540" y1="112" x2="540" y2="504" class="grid"/><text x="540" y="532" text-anchor="middle" class="axis">4</text><line x1="660" y1="112" x2="660" y2="504" class="grid"/><text x="660" y="532" text-anchor="middle" class="axis">6</text><line x1="780" y1="112" x2="780" y2="504" class="grid"/><text x="780" y="532" text-anchor="middle" class="axis">8</text><line x1="900" y1="112" x2="900" y2="504" class="grid"/><text x="900" y="532" text-anchor="middle" class="axis">10</text><text x="282" y="153" text-anchor="end" class="label">MED</text><rect x="300" y="135" width="477.01800000000003" height="27" rx="4" fill="#3566A8"/><text x="786.018" y="153" class="value">7.950</text><text x="282" y="201" text-anchor="end" class="label">GAP</text><rect x="300" y="183" width="470.448" height="27" rx="4" fill="#4A86B8"/><text x="779.448" y="201" class="value">7.841</text><text x="282" y="249" text-anchor="end" class="label">CALIC-style</text><rect x="300" y="231" width="492.12600000000003" height="27" rx="4" fill="#78A6C9"/><text x="801.126" y="249" class="value">8.202</text><text x="282" y="297" text-anchor="end" class="label">CNN v1 5×5</text><rect x="300" y="279" width="277.94399999999996" height="27" rx="4" fill="#B2C6D8"/><text x="586.944" y="297" class="value">4.632</text><text x="282" y="345" text-anchor="end" class="label">CNN v2 5×5</text><rect x="300" y="327" width="279.438" height="27" rx="4" fill="#D48B4C"/><text x="588.438" y="345" class="value">4.657</text><text x="282" y="393" text-anchor="end" class="label">CNN v3 5×5</text><rect x="300" y="375" width="277.398" height="27" rx="4" fill="#C66B57"/><text x="586.398" y="393" class="value">4.623</text><text x="282" y="441" text-anchor="end" class="label">CNN v4 3×3</text><rect x="300" y="423" width="288.78" height="27" rx="4" fill="#C66B57"/><text x="597.78" y="441" class="value">4.813</text><text x="282" y="489" text-anchor="end" class="label">CNN v5 7×7</text><rect x="300" y="471" width="281.29200000000003" height="27" rx="4" fill="#8E7BAA"/><text x="590.292" y="489" class="value">4.688</text><text x="600" y="560" text-anchor="middle" class="axis">Mean absolute prediction error</text><text x="48" y="575" class="note">v3 has lower MAE than v4; v4 is selected for its smaller model/compute footprint.</text></svg>