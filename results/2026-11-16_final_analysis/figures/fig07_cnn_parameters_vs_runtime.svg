<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610"><title>CNN model size and predictor runtime</title><desc>Five frozen CNN checkpoints on the same deterministic CPU benchmark</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#202a35}.title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#566270}.axis{font-size:12px;fill:#596574}.label{font-size:14px}.value{font-size:13px;font-weight:700}.note{font-size:12px;fill:#5b6571}.grid{stroke:#e3e8ee;stroke-width:1}</style><rect width="1000" height="610" fill="#fff"/><text x="48" y="48" class="title">CNN model size and predictor runtime</text><text x="48" y="76" class="subtitle">Five frozen CNN checkpoints on the same deterministic CPU benchmark</text><line x1="110" y1="125" x2="110" y2="490" class="grid"/><text x="110" y="512" text-anchor="middle" class="axis">0k</text><line x1="110" y1="490" x2="900" y2="490" class="grid"/><text x="98" y="494" text-anchor="end" class="axis">0</text><line x1="247.3913043478261" y1="125" x2="247.3913043478261" y2="490" class="grid"/><text x="247.3913043478261" y="512" text-anchor="middle" class="axis">40k</text><line x1="110" y1="423.6363636363636" x2="900" y2="423.6363636363636" class="grid"/><text x="98" y="427.6363636363636" text-anchor="end" class="axis">600</text><line x1="384.7826086956522" y1="125" x2="384.7826086956522" y2="490" class="grid"/><text x="384.7826086956522" y="512" text-anchor="middle" class="axis">80k</text><line x1="110" y1="357.27272727272725" x2="900" y2="357.27272727272725" class="grid"/><text x="98" y="361.27272727272725" text-anchor="end" class="axis">1200</text><line x1="522.1739130434783" y1="125" x2="522.1739130434783" y2="490" class="grid"/><text x="522.1739130434783" y="512" text-anchor="middle" class="axis">120k</text><line x1="110" y1="290.90909090909093" x2="900" y2="290.90909090909093" class="grid"/><text x="98" y="294.90909090909093" text-anchor="end" class="axis">1800</text><line x1="659.5652173913044" y1="125" x2="659.5652173913044" y2="490" class="grid"/><text x="659.5652173913044" y="512" text-anchor="middle" class="axis">160k</text><line x1="110" y1="224.54545454545456" x2="900" y2="224.54545454545456" class="grid"/><text x="98" y="228.54545454545456" text-anchor="end" class="axis">2400</text><line x1="796.9565217391304" y1="125" x2="796.9565217391304" y2="490" class="grid"/><text x="796.9565217391304" y="512" text-anchor="middle" class="axis">200k</text><line x1="110" y1="158.1818181818182" x2="900" y2="158.1818181818182" class="grid"/><text x="98" y="162.1818181818182" text-anchor="end" class="axis">3000</text><circle cx="271.0260434782609" cy="411.63792878787876" r="10" fill="#C66B57"/><text x="284.0260434782609" y="401.63792878787876" class="value">v4 3×3</text><circle cx="496.1279565217391" cy="332.1487818181819" r="10" fill="#4A86B8"/><text x="509.1279565217391" y="322.1487818181819" class="value">v1 5×5</text><circle cx="495.9081304347826" cy="348.9126787878788" r="10" fill="#78A6C9"/><text x="508.9081304347826" y="338.9126787878788" class="value">v2 5×5</text><circle cx="496.1279565217391" cy="330.9710484848485" r="10" fill="#B2C6D8"/><text x="509.1279565217391" y="320.9710484848485" class="value">v3 5×5</text><circle cx="833.7808260869565" cy="153.6319272727273" r="10" fill="#D48B4C"/><text x="846.7808260869565" y="143.6319272727273" class="value">v5 7×7</text><text x="505" y="555" text-anchor="middle" class="axis">Parameter count</text><text x="28" y="307.5" transform="rotate(-90 28 307.5)" text-anchor="middle" class="axis">Predictor runtime (ms)</text><text x="48" y="575" class="note">v4 is the smallest CNN, but still much slower than MED, GAP and CALIC.</text></svg>